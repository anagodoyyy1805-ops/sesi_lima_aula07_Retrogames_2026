<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroGames | Loja de Jogos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🎮 RetroGames</h1>
        <p>Sua nostalgia começa aqui! Os melhores jogos de todas as gerações.</p>
    </header>

    <main class="container">

        <section class="titulo-secao">
            <div>
                <h2>Nosso Catálogo</h2>
                <p>Explore os clássicos e descubra seu próximo jogo favorito.</p>
            </div>

            <button id="btnCadastrar" type="button">
                + Cadastrar Jogo
            </button>
        </section>

        <section id="listaJogos" class="listar-jogos">
            <p id="mensagemVazia">🎮 Nenhum jogo cadastrado</p>
        </section>

    </main>

    <dialog id="modalCadastro">
        <h2>🎮 Novo Jogo</h2>
     <form id="formJogos">
            <label for="nome">Nome do Jogo</label>
            <input type="text" id="nome" required>
            <label for="autor">Autor do Jogo</label>
            <input type="text" id="autor" required>
            <label for="genero">Gênero</label>
            <input type="text" id="genero" required>
            <label for="imagem">URL da imagem do Jogo</label>
            <input type="url" id="imagem" placeholder="https://exemplo.com/capa.webp" required>
            <label for="preco">Preço (R$)</label>
            <input type="number" id="preco" min="0.01" step="0.01" required>
            <div class="acoes">
                <button type="button" id="btnCancelar" class="cancelar">Cancelar</button>
                <button type="submit">Salvar disco</button>
            </div>
        </form>

    </dialog>

    <footer>
        <p>© 2026 RetroGames — Feito para quem ama videogames.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
